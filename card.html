<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lauren Gorman · Digital Card</title>
  <meta name="description" content="Lauren Gorman — Flautist and Music Educator. Scan the QR code or tap Save to add her to your contacts." />

  <meta property="og:title" content="Lauren Gorman · Digital Card" />
  <meta property="og:description" content="Flautist and Music Educator — Melbourne, Victoria" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/img/cover.jpg" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:      #0e0e0e;
      --surface: #171717;
      --line:    rgba(236, 236, 236, 0.10);
      --line-2:  rgba(236, 236, 236, 0.22);
      --text:    #ececec;
      --muted:   #8a8a8a;
      --accent:  #ffffff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Jost", -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.2rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      max-width: 420px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.55);
      animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

    .card-photo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 30%;
      margin: 0 auto 1.3rem;
      display: block;
      filter: grayscale(1) contrast(1.03);
      border: 1px solid var(--line);
    }
    .card-eyebrow {
      font-size: 0.66rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.7rem;
    }
    .card-name {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: 2.4rem;
      line-height: 1.05;
      letter-spacing: 0.005em;
      color: #fff;
      margin: 0 0 0.45rem;
    }
    .card-location {
      font-size: 0.72rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 1.8rem;
    }

    /* Interactive QR */
    .qr-frame {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      display: inline-block;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      position: relative;
      box-shadow: 0 0 0 0 rgba(255,255,255,0);
    }
    .qr-frame:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.08);
    }
    .qr-frame img { display: block; width: 200px; height: 200px; }
    .qr-hint {
      font-size: 0.65rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0.9rem 0 1.8rem;
    }

    .card-links {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin: 0 0 1.6rem;
    }
    .card-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.3s ease;
    }
    .card-links a:hover { color: var(--accent); }

    .card-actions { display: flex; flex-direction: column; gap: 0.55rem; margin: 0 0 1.2rem; }
    .btn {
      display: block;
      padding: 0.85rem 1.4rem;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.76rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 500;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.3s cubic-bezier(0.16,1,0.3,1);
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn-primary:hover { background: #d0d0d0; border-color: #d0d0d0; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--line-2); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .card-foot { text-align: center; margin-top: 0.4rem; }
    .card-foot a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }
    .card-foot a:hover { color: var(--accent); }

    /* Print styles — makes this printable as a physical business card */
    @media print {
      body { background: #fff; padding: 0; display: block; }
      .card {
        background: #fff;
        color: #000;
        border: none;
        box-shadow: none;
        padding: 1.5rem;
        max-width: 90mm;
        animation: none;
      }
      .card-name { color: #000; }
      .card-photo { filter: none; }
      .qr-frame { padding: 0; box-shadow: none; }
      .card-actions, .card-foot { display: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="card-photo" src="assets/img/about-portrait.jpg" alt="Lauren Gorman" />

    <p class="card-eyebrow">Flautist · Music Educator</p>
    <h1 class="card-name">Lauren Gorman</h1>
    <p class="card-location">Melbourne, Victoria</p>

    <a class="qr-frame" href="lauren.vcf" download="lauren-gorman.vcf" title="Tap to save contact, or scan with your phone camera">
      <img src="assets/img/lauren-qr.svg" alt="QR code — scan to save Lauren Gorman's contact details" />
    </a>
    <p class="qr-hint">Scan to save contact</p>

    <div class="card-links">
      <a href="mailto:Contact@laurengorman.com">Contact@laurengorman.com</a>
      <a href="tel:+61488564024">+61 488 564 024</a>
    </div>

    <div class="card-actions">
      <a class="btn btn-primary" href="lauren.vcf" download="lauren-gorman.vcf">Save to Contacts</a>
      <a class="btn btn-ghost" href="index.html">Visit Website</a>
    </div>

    <p class="card-foot">
      <a href="assets/img/lauren-qr.svg" download="lauren-gorman-qr.svg">Download QR</a>
    </p>
  </main>
</body>
</html>
